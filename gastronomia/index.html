<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sabores de Seabra</title>
  <link rel="stylesheet" href="/src/components/css/header.css" />
  <link rel="stylesheet" href="gastronomia.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
  <header>
    <nav class="nav1">
      <div class="pesquisa">
        
        <img src="/public/assets/icons/sabores.png" alt="logo" class="logo" />

        <input type="search" placeholder="Pesquisar" />
        <button type="button">&#8981;</button>
      </div>

      <div class="navTags">
        <a href="">Favoritos</a>
        <a href="">Descobrir</a>
        <a href="">Sobre nós</a>
      </div>

      <a href="" class="btnEntrar">Entrar</a>
    </nav>
  </header>

  <main>

    <section class="gastronomia" id="categorias">
      <h2>Explore por categoria</h2>

      <div class="categorias-grid">
        <a href="" class="categoria">
          <i class="fa-solid fa-utensils"></i>
          <span>Restaurantes</span>
        </a>

        <a href="" class="categoria">
          <i class="fa-solid fa-burger"></i>
          <span>Hamburguerias</span>
        </a>

        <a href="" class="categoria">
          <i class="fa-solid fa-mug-hot"></i>
          <span>Cafés</span>
        </a>

        <a href="" class="categoria">
          <i class="fa-solid fa-pizza-slice"></i>
          <span>Pizzarias</span>
        </a>

        <a href="" class="categoria">
          <i class="fa-solid fa-bread-slice"></i>
          <span>Lanchonetes</span>
        </a>

        <a href="" class="categoria">
          <i class="fa-solid fa-location-dot"></i>
          <span>Ver todos</span>
        </a>
      </div>

      <section class="lugares" id="lugares">

        <h2>Lugares para conhecer</h2>

        <p>
          Uma seleção de lugares para sua próxima experiência gastronômica.
        </p>

        <div class="lugares-grid">
          <a href="#" class="lugar-card">
            <img src="/public/assets/images/restaurante.jpg" alt="Restaurante com mesas preparadas para jantar" />
            <h3>Restaurante</h3>
          </a>

          <a href="#" class="lugar-card">
            <img src="/public/assets/images/hamburguer.jpg" alt="Hambúrguer artesanal com queijo e salada" />
            <h3>Hamburgueria</h3>
          </a>

          <a href="#" class="lugar-card">
            <img src="/public/assets/images/cafeteria.jpg" alt="Café servido em uma cafeteria aconchegante" />
            <h3>Café</h3>
          </a>
        </div>
      </section>
    </section>
  </main>
</body>

</html>
